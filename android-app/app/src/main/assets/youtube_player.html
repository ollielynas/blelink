<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  #player { width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="player"></div>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
  // Minimal queue player driven from the Android side via evaluateJavascript("addToQueue('<id>')").
  // Videos play in the order they're queued; the next one starts automatically when one ends.
  // Once the queue runs dry, it keeps the party going by replaying a random video from
  // everything queued so far, rather than just stopping.
  let player = null;
  let ready = false;
  let isPlaying = false;
  let currentVideoId = null;
  const queue = [];
  const history = []; // every videoId ever queued, for random replay once the queue is empty

  function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
      height: '100%',
      width: '100%',
      playerVars: { playsinline: 1, autoplay: 1, controls: 1, rel: 0 },
      events: {
        onReady: () => { ready = true; playNextIfIdle(); },
        onStateChange: onPlayerStateChange
      }
    });
  }

  function onPlayerStateChange(event) {
    if (event.data === YT.PlayerState.PLAYING) {
      isPlaying = true;
    } else if (event.data === YT.PlayerState.ENDED) {
      isPlaying = false;
      playNextIfIdle();
    }
  }

  function playNextIfIdle() {
    if (isPlaying) return;
    if (queue.length > 0) {
      const videoId = queue.shift();
      isPlaying = true; // optimistic; corrected by the next onStateChange if it doesn't actually start
      currentVideoId = videoId;
      player.loadVideoById(videoId);
    } else if (history.length > 0) {
      const videoId = history[Math.floor(Math.random() * history.length)];
      isPlaying = true;
      currentVideoId = videoId;
      player.loadVideoById(videoId);
    }
  }

  // Called from MainActivity.kt when a guest queues a song.
  function addToQueue(videoId) {
    queue.push(videoId);
    history.push(videoId);
    if (ready) playNextIfIdle();
  }

  // Polled from MainActivity.kt every few seconds and relayed to guest browsers so their
  // own players (if they've tapped "Join Audio") can stay roughly in step with the phone.
  function getPlaybackState() {
    if (!ready || !player || typeof player.getCurrentTime !== 'function') {
      return { videoId: null, position: 0, playing: false };
    }
    return { videoId: currentVideoId, position: player.getCurrentTime(), playing: isPlaying };
  }

  // Called from MainActivity.kt while casting to a TV, so audio doesn't come out of the phone
  // and the TV at the same time — the video keeps playing here (still driving the queue/sync
  // loop), just silently.
  function mute() {
    if (player && typeof player.mute === 'function') player.mute();
  }
  function unMute() {
    if (player && typeof player.unMute === 'function') player.unMute();
  }
</script>
</body>
</html>
